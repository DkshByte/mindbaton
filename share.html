<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/app-192.png">
<title>Save to memgraph</title>
<style>
  @font-face { font-family: "Geist"; src: url("/assets/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  :root { --bg: #09090b; --panel: #111113; --raise: #18181b; --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.13);
    --text: #ededef; --muted: #a1a1aa; --faint: #71717a; --accent: #8b95ff; --accent2: #a5b0ff; --ok: #3dd68c; --bad: #ff6369; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 560px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom)); display: grid; gap: 20px; }
  header { display: flex; align-items: center; gap: 10px; padding-top: 4px; }
  .mark { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(145deg, #2a2f5c, #14162a); border: 1px solid rgba(139,149,255,.35); display: grid; place-items: center; }
  .mark svg { width: 15px; height: 15px; stroke: var(--accent2); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  .label { font-size: 12px; font-weight: 500; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 8px; }
  textarea { width: 100%; min-height: 150px; max-height: 45vh; resize: vertical; padding: 12px 13px; border-radius: 12px; border: 1px solid var(--line2);
    background: var(--panel); color: var(--text); font: inherit; line-height: 1.5; }
  textarea:focus { outline: none; border-color: rgba(139,149,255,.55); box-shadow: 0 0 0 3px rgba(139,149,255,.14); }
  .hint { color: var(--faint); font-size: 12px; margin: 6px 2px 0; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
  .seg button { height: 44px; border: 0; border-radius: 9px; background: none; color: var(--muted); font-weight: 500; font-size: 15px; font-family: inherit; }
  .seg button[aria-pressed="true"] { background: var(--raise); color: var(--text); box-shadow: inset 0 0 0 1px var(--line2); }
  .ais { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .ais button { height: 64px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text);
    display: grid; place-items: center; gap: 4px; padding: 10px 0 8px; font-weight: 500; font-size: 12px; font-family: inherit; }
  .ais button[aria-pressed="true"] { border-color: rgba(139,149,255,.6); background: rgba(139,149,255,.08); }
  .ais img, .ais .mono { width: 20px; height: 20px; }
  .ais .mono { background: var(--text); -webkit-mask: var(--src) center / contain no-repeat; mask: var(--src) center / contain no-repeat; }
  .ais .none { width: 20px; height: 20px; border-radius: 50%; border: 1.5px dashed var(--faint); }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, var(--bg) 30%); }
  .bar .in { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; }
  .primary { flex: 1; height: 50px; border: 0; border-radius: 12px; background: var(--text); color: #0b0b0d; font-weight: 600; font-size: 15px; font-family: inherit; }
  .primary:disabled { opacity: .45; }
  .ghost { height: 50px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line2); background: none; color: var(--text); font-weight: 500; font-size: 15px; font-family: inherit; }
  button { cursor: pointer; } button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .done { display: grid; gap: 14px; text-align: center; padding: 48px 8px 0; }
  .done .tick { width: 56px; height: 56px; margin: 0 auto; border-radius: 50%; background: rgba(61,214,140,.12); display: grid; place-items: center; }
  .done .tick svg { width: 26px; height: 26px; stroke: var(--ok); fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .done p { margin: 0; color: var(--muted); }
  .err { color: #ff9a9e; font-size: 15px; margin: 0; }
  a { color: var(--accent2); }
  @media (prefers-reduced-motion: no-preference) { .done { animation: in .3s cubic-bezier(.2,.8,.2,1); } @keyframes in { from { opacity: 0; transform: translateY(6px); } } }
</style>
<main id="app">
  <header><span class="mark"><svg viewBox="0 0 16 16"><path d="M3.2 12.2V4.6L8 9.4l4.8-4.8v7.6"/></svg></span><h1>Save to memgraph</h1></header>
  <section>
    <p class="label">What to save</p>
    <textarea id="text" aria-label="Text to save" placeholder="Share a message from any app, or type here…"></textarea>
    <p class="hint" id="meta"></p>
  </section>
  <section>
    <p class="label">Who wrote it</p>
    <div class="seg" role="group" aria-label="Who wrote it">
      <button id="me" aria-pressed="true">Me</button><button id="bot" aria-pressed="false">The AI</button>
    </div>
    <p class="hint" id="whohint"></p>
  </section>
  <section>
    <p class="label">Which app</p>
    <div class="ais" id="ais"></div>
  </section>
  <p class="err" id="err" hidden></p>
</main>
<div class="bar"><div class="in"><button class="ghost" id="cancel">Cancel</button><button class="primary" id="save">Save</button></div></div>
<script>
const $ = id => document.getElementById(id);
const APPS = [  // [label, site key the server knows, logo key in assets/icons/index.json]
  ["ChatGPT", "chatgpt.com", "ChatGPT"], ["Gemini", "gemini.google.com", "Gemini"], ["Claude", "claude.ai", "Claude"],
  ["Perplexity", "www.perplexity.ai", "Perplexity"], ["DeepSeek", "chat.deepseek.com", "DeepSeek"], ["Grok", "grok.com", "Grok"],
  ["Copilot", "copilot.microsoft.com", "Copilot"], ["Mistral", "chat.mistral.ai", "Mistral"], ["Other", "phone", null]];
const GUESS = [[/chatgpt\.com|chat\.openai\.com|\bchatgpt\b/i, "chatgpt.com"], [/gemini\.google|g\.co\/gemini|\bgemini\b/i, "gemini.google.com"],
  [/claude\.ai|\bclaude\b/i, "claude.ai"], [/perplexity/i, "www.perplexity.ai"], [/deepseek/i, "chat.deepseek.com"], [/grok\.com|\bgrok\b/i, "grok.com"],
  [/copilot/i, "copilot.microsoft.com"], [/mistral|le chat/i, "chat.mistral.ai"]];
const q = new URLSearchParams(location.search);
const title = (q.get("title") || "").trim(), url = (q.get("url") || "").trim();
let text = (q.get("text") || "").trim();
if (url && !text) text = url;  // the link is saved with it anyway
$("text").value = text;
let site = (GUESS.find(([rx]) => rx.test(url + " " + title + " " + text.slice(0, 300))) || [, "phone"])[1];
// long, formatted text is usually the AI's answer; a line or two is usually the user
let bot = text.length > 500 || /^\s*([-*•]|\d+\.)\s/m.test(text) || /```/.test(text);
$("meta").textContent = title ? `From “${title}”` : "";

function render() {
  $("me").setAttribute("aria-pressed", String(!bot)); $("bot").setAttribute("aria-pressed", String(bot));
  $("whohint").textContent = bot ? "Kept as a conversation you can search and hand off — not as facts about you."
                                 : "memgraph learns from it: facts, preferences, plans.";
  document.querySelectorAll(".ais button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.site === site)));
  $("save").disabled = !$("text").value.trim();
}
fetch("/assets/icons/index.json").then(r => r.json()).catch(() => ({})).then(icons => {
  $("ais").innerHTML = APPS.map(([label, s, key]) => {
    const ic = key && icons[key];
    const img = !ic ? `<span class="none"></span>` : ic.mono ? `<span class="mono" style="--src:url('/assets/icons/${ic.src}')"></span>`
                                                         : `<img src="/assets/icons/${ic.src}" alt="">`;
    return `<button data-site="${s}" aria-pressed="false">${img}${label}</button>`;
  }).join("");
  render();
});
$("ais").onclick = e => { const b = e.target.closest("button"); if (b) { site = b.dataset.site; render(); } };
$("me").onclick = () => { bot = false; render(); };
$("bot").onclick = () => { bot = true; render(); };
$("text").oninput = render;
$("cancel").onclick = () => location.replace("/");

$("save").onclick = async () => {
  const body = $("text").value.trim();
  if (!body) return;
  $("save").disabled = true; $("err").hidden = true;
  const app = APPS.find(a => a[1] === site)[0];
  try {
    const r = bot
      ? await fetch("/session", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
          site, id: "share-" + Date.now(), url: url || null, chat: title || `Shared from ${app} · ${new Date().toLocaleString([], { dateStyle: "medium", timeStyle: "short" })}`,
          turns: [{ role: "assistant", text: body }] }) })
      : await fetch("/capture", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: body, site, chat: title || null, url: url || null }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "Server error " + r.status);
    const out = await r.json();
    const n = bot ? 1 : (out.ids || []).length;
    $("app").innerHTML = `<div class="done"><span class="tick"><svg viewBox="0 0 24 24"><path d="M5 12.5 10 17 19 7.5"/></svg></span>
      <h1>Saved</h1><p>${bot ? `Kept as a conversation from ${app}.` : n ? `${n} ${n === 1 ? "memory" : "memories"} from ${app}.` : `Already known — memgraph had this.`}</p>
      <p><a href="/">Open memgraph</a></p></div>`;
    document.querySelector(".bar").hidden = true;
  } catch (e) {
    $("err").textContent = "Couldn't save: " + e.message + ". Is Tailscale on?"; $("err").hidden = false; $("save").disabled = false;
  }
};
render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</html>
