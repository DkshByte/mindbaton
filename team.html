<dialog id="connect-dialog" class="dialog" aria-labelledby="connect-title"><div class="dialog-head"><h2 id="connect-title">Connect an AI</h2><button class="close-button" data-close data-icon="close" aria-label="Close connection setup"></button></div><div class="dialog-body"><p>Give this client its own project access. Your other chats stay private.</p><div class="client-choices" role="group" aria-label="Client to connect"><button class="client-choice" data-client="codex" aria-pressed="true"><img src="/assets/icons/lh/codex-color.svg" alt="">Codex</button><button class="client-choice" data-client="claude" aria-pressed="false"><img src="/assets/icons/lh/claudecode-color.svg" alt="">Claude Code</button><button class="client-choice" data-client="browser" aria-pressed="false" data-icon="browser">Browser extension</button><button class="client-choice" data-client="mcp" aria-pressed="false" data-icon="plug">Other MCP client</button></div><form id="device"><label>Device name<input name="name" maxlength="100" required value="My Codex laptop" autocomplete="off"></label><p class="field-help">Use a name your team will recognize.</p><div class="dialog-footer"><button class="btn primary" data-icon="key">Create device token</button></div></form><div id="token-box" class="token-box" hidden><p>This token accesses this project only. Keep it private.</p><label>Project device token<input id="secret" type="password" readonly autocomplete="off"></label><div class="row"><button id="copy-token" class="btn small" data-icon="copy">Copy token</button><button id="reveal-token" class="btn quiet small">Show</button></div></div><div class="instructions"><h3 id="setup-title">Set up Codex</h3><p id="setup-help">Create a device token above, then configure the Python helper.</p><details id="setup-details"><summary>Setup instructions</summary><p id="setup-note"></p><pre id="setup"></pre><a class="btn quiet small" href="/team_client.py" download data-icon="download">Download Python helper</a></details></div><p class="dialog-error" role="alert"></p></div></dialog>
<dialog id="invite-dialog" class="dialog invitation" aria-labelledby="invite-title"><div class="dialog-head"><h2 id="invite-title">Invite a teammate</h2><button class="close-button" data-close data-icon="close" aria-label="Close invitation"></button></div><div class="dialog-body"><p>Share this code. You approve who joins.</p><div id="invite-code" class="invite-code" role="group" aria-label="Invite code">Creating invite…</div><div class="invite-facts"><span id="invite-expiry">Expires in ten minutes</span><span data-icon="lock" class="row">Project-only access</span></div><div class="invite-actions"><button id="copy-invite" class="btn primary" data-icon="copy">Copy invite</button><button id="rotate-invite" class="btn quiet" title="Replaces the previous code" aria-label="New code, replacing the previous code">New code</button><button id="disable-invite" class="btn quiet">Disable invite</button></div><p class="dialog-error" role="alert"></p></div></dialog>
<dialog id="publish-dialog" class="dialog" aria-labelledby="publish-title"><div class="dialog-head"><h2 id="publish-title">Share an update</h2><button class="close-button" data-close data-icon="close" aria-label="Close update"></button></div><div class="dialog-body"><form id="publish"><div class="field-group"><label>Update type<select name="kind" class="field"><option value="progress">Reported progress</option><option value="discovery">Discovery</option><option value="proposal">Proposal</option><option value="blocker">Blocker</option><option value="handoff">Handoff</option><option value="correction">Correction</option><option value="decision">Agreed decision (host)</option></select></label></div><label>What should the team know?<textarea name="content" maxlength="12000" placeholder="A discovery, a blocker, or what changed…" required></textarea></label><details><summary>Sources and corrections</summary><label>Replace an earlier update<select name="replaces" class="field"><option value="">Keep as a new update</option></select></label><label>Source references, one per line<textarea name="sources" placeholder="Copy a reference from a shared message"></textarea></label></details><p class="field-help">Progress is reported, not verified. The host alone marks agreed decisions.</p><div class="dialog-footer"><button type="button" class="btn quiet" data-close>Cancel</button><button class="btn primary">Publish update</button></div></form><p class="dialog-error" role="alert"></p></div></dialog>
<dialog id="context-dialog" class="dialog wide" aria-labelledby="context-title"><div class="dialog-head"><h2 id="context-title">Your shared briefing</h2><button class="close-button" data-close data-icon="close" aria-label="Close briefing"></button></div><div class="dialog-body"><p>Current project context, with source references. Recent messages fill gaps while summaries catch up.</p><div class="row" style="margin-top:16px"><button id="refresh-context" class="btn small" data-icon="refresh">Refresh</button><button id="copy-full-context" class="btn small" data-icon="copy">Copy briefing</button></div><pre id="context"></pre><p class="dialog-error" role="alert"></p></div></dialog>
<dialog id="sources-dialog" class="dialog wide" aria-labelledby="sources-title"><div class="dialog-head"><h2 id="sources-title">Shared messages</h2><button class="close-button" data-close data-icon="close" aria-label="Close messages"></button></div><div class="dialog-body"><div id="sources"></div><p class="dialog-error" role="alert"></p></div></dialog>
<dialog id="create-dialog" class="dialog" aria-labelledby="create-title"><div class="dialog-head"><h2 id="create-title">Start a shared project</h2><button class="close-button" data-close data-icon="close" aria-label="Close project form"></button></div><div class="dialog-body"><p>Only chats you explicitly select will be shared with this project.</p><form id="create"><div class="field-group"><label>Project name<input name="name" maxlength="100" placeholder="e.g. Website redesign" required></label></div><div class="dialog-footer"><button class="btn primary">Create project</button></div></form><p class="dialog-error" role="alert"></p></div></dialog>
<dialog id="join-dialog" class="dialog invitation" aria-labelledby="join-title"><div class="dialog-head"><h2 id="join-title">Join a project</h2><button class="close-button" data-close data-icon="close" aria-label="Close project invitation"></button></div><div class="dialog-body"><section id="nearby" class="nearby-section" aria-labelledby="nearby-title"><div class="section-head"><div><h3 id="nearby-title">Host</h3></div><button id="find-servers" aria-expanded="false" aria-controls="nearby-results" class="btn quiet small" data-icon="search">Find nearby</button></div><div class="host-current"><span data-icon="devices"></span><span id="join-current-host" class="grow"></span><span class="badge" data-icon="check" aria-label="Selected host"></span></div><div class="nearby-progress" aria-hidden="true"></div><div id="nearby-results" class="nearby-results" hidden><p id="nearby-status" class="nearby-status" role="status">Looking for hosts on this server’s local network…</p><ul id="nearby-hosts" class="nearby-list"></ul><p id="nearby-setup" class="nearby-note"></p><p class="nearby-note">Search uses this server’s LAN. Verify the host address.</p></div></section><form id="join"><fieldset class="field-group code-field"><legend>Invite code</legend><div class="join-code"><input class="code-character" type="text" inputmode="text" maxlength="1" pattern="[A-Za-z0-9]" required aria-label="Invite code character 1 of 6" aria-describedby="code-help" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false"><input class="code-character" type="text" inputmode="text" maxlength="1" pattern="[A-Za-z0-9]" required aria-label="Invite code character 2 of 6" aria-describedby="code-help" autocomplete="off" autocapitalize="characters" spellcheck="false"><input class="code-character" type="text" inputmode="text" maxlength="1" pattern="[A-Za-z0-9]" required aria-label="Invite code character 3 of 6" aria-describedby="code-help" autocomplete="off" autocapitalize="characters" spellcheck="false"><span class="code-separator" aria-hidden="true">-</span><input class="code-character" type="text" inputmode="text" maxlength="1" pattern="[A-Za-z0-9]" required aria-label="Invite code character 4 of 6" aria-describedby="code-help" autocomplete="off" autocapitalize="characters" spellcheck="false"><input class="code-character" type="text" inputmode="text" maxlength="1" pattern="[A-Za-z0-9]" required aria-label="Invite code character 5 of 6" aria-describedby="code-help" autocomplete="off" autocapitalize="characters" spellcheck="false"><input class="code-character" type="text" inputmode="text" maxlength="1" pattern="[A-Za-z0-9]" required aria-label="Invite code character 6 of 6" aria-describedby="code-help" autocomplete="off" autocapitalize="characters" spellcheck="false"></div><input name="code" type="hidden"><p id="code-help" class="field-help">Paste a code like ABC-234.</p></fieldset><div class="field-group"><label>Your name<input name="name" required maxlength="100" autocomplete="name"></label></div><div class="dialog-footer"><button type="submit" class="btn primary" data-icon="arrow-right">Request to join</button></div><p class="join-assurance" data-icon="lock">Host approval. Personal memory stays private.</p></form><p id="join-status" class="field-help" role="status"></p><p class="dialog-error" role="alert"></p></div></dialog>
<dialog id="confirm-dialog" class="dialog" aria-labelledby="confirm-title"><div class="dialog-head"><h2 id="confirm-title"></h2><button class="close-button" data-close data-icon="close" aria-label="Close confirmation"></button></div><div class="dialog-body"><p id="confirm-description"></p><div class="dialog-footer"><button class="btn quiet" data-close>Cancel</button><button id="confirm-action" class="btn danger"></button></div><p class="dialog-error" role="alert"></p></div></dialog>
