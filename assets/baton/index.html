<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baton illustrations · Mindbaton</title>
<link rel="icon" href="../brand/app-icon.svg">
<style>
@font-face{font-family:Geist;src:url('../fonts/Geist-Variable.woff2');font-weight:100 900;font-display:swap}
:root{color-scheme:dark;--bg:#111110;--panel:#191918;--fg:#eeeeec;--muted:#b5b3ad;--line:#ffffff20;--preview:#222221}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 Geist,system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:40px 36px 64px}header{display:flex;gap:24px;align-items:center;justify-content:space-between;margin-bottom:32px}h1{font-size:30px;line-height:1.2;letter-spacing:-.025em;font-weight:600;margin:0 0 10px}header p{color:var(--muted);margin:0;max-width:60ch}.brand{display:flex;align-items:center;gap:9px;margin-bottom:30px;font-weight:600}.brand img{width:28px;height:28px}a{color:inherit;text-underline-offset:3px}button,a{outline-offset:4px}button:focus-visible,a:focus-visible{outline:2px solid var(--fg)}.controls{display:flex;gap:6px;flex-wrap:wrap}.controls button{border:1px solid var(--line);border-radius:7px;padding:10px 14px;background:transparent;color:var(--muted);font:inherit;cursor:pointer}.controls button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:transparent}.controls button:hover{border-color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}figure{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}.preview{display:grid;place-items:center;aspect-ratio:1;background:var(--preview);padding:18px}.preview img{width:100%;height:100%;object-fit:contain;min-width:0;min-height:0}body[data-background=light]{--preview:#f4f3ef}body[data-background=checker] .preview{background-color:#e9e8e4;background-image:conic-gradient(#cecdc8 25%,transparent 0 50%,#cecdc8 0 75%,transparent 0);background-size:20px 20px}figcaption{padding:16px 18px 18px}h2{font-size:14px;font-weight:600;line-height:1.4;margin:0 0 5px}figcaption p{font-size:12px;color:var(--muted);margin:0;min-height:38px}.download{display:inline-flex;align-items:center;gap:7px;font-size:12px;margin-top:12px;color:var(--fg)}footer{margin-top:30px;color:var(--muted);font-size:12px}footer a{margin-right:18px}.no-script{color:var(--muted)}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}header{align-items:flex-start;flex-direction:column}}@media(max-width:640px){main{padding:28px 18px 48px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.preview{padding:8px}figcaption{padding:13px}h1{font-size:26px}.controls button{min-height:44px}figcaption p{min-height:58px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body data-background="dark">

<footer><a href="manifest.json" download>Asset manifest &amp; prompts</a><a href="baton-collection.zip" download>Download all 13 PNGs</a><p>Monochrome Baton characters · transparent backgrounds · generated using the Mindbaton character reference.</p></footer>
</main>
<script>
document.querySelectorAll('button[data-background]').forEach(button=>button.addEventListener('click',()=>{document.body.dataset.background=button.dataset.background;document.querySelectorAll('button[data-background]').forEach(other=>other.setAttribute('aria-pressed',String(button===other)));}));
</script>
</body>
